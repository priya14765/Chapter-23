      function initMatchGame(el) {
        const grid = el.querySelector("#matchGrid");
        const status = el.querySelector("#matchStatus");
        const nextBtn = el.querySelector("#matchNextBtn");
        const memoryModal = document.getElementById("memoryCollected");
        const mcName = document.getElementById("mcName");
        const mcDesc = document.getElementById("mcDesc");
        const mcImg = document.getElementById("mcImg");
        const mcContinue = document.getElementById("mcContinue");
        let cards = [],
          flipped = [],
          matched = 0,
          lock = false,
          matchedData = [];
        const selected = pickUniqueMoments(4);
        const deck = [];
        selected.forEach((data, idx) => {
          deck.push({
            name: data.t,
            desc: data.c,
            tamDesc: data.tam_c,
            pairId: idx,
          });
          deck.push({
            name: data.t,
            desc: data.c,
            tamDesc: data.tam_c,
            pairId: idx,
          });
        });
        for (let i = deck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [deck[i], deck[j]] = [deck[j], deck[i]];
        }

        function renderCards() {
          grid.innerHTML = "";
          cards = [];
          deck.forEach((data, index) => {
            const card = document.createElement("div");
            card.className = "match-card";
            card.dataset.pairId = data.pairId;
            card.dataset.name = data.name;
            card.dataset.desc = data.desc;
            card.dataset.tamDesc = data.tamDesc;
            card.dataset.index = index;
            const isMatched = matchedData.some((m) => m.pairId === data.pairId);
            if (isMatched) card.classList.add("matched", "flipped");
            card.innerHTML = `<div class="match-card-inner"><div class="match-card-face back">❤️</div><div class="match-card-face front"><img src="${DIR.MOMENTS + encodeURIComponent(data.name + ".jpg")}" alt="${data.name}" onerror="this.parentElement.innerHTML='<div class=\\'no-img\\'>${data.name}</div>'"></div></div>`;
            card.addEventListener("click", () => flipCard(card));
            grid.appendChild(card);
            cards.push(card);
          });
        }

        function flipCard(card) {
          if (
            lock ||
            card.classList.contains("flipped") ||
            card.classList.contains("matched") ||
            flipped.length >= 2
          )
            return;
          card.classList.add("flipped");
          flipped.push(card);
          if (flipped.length === 2) {
            lock = true;
            const p1 = flipped[0].dataset.pairId,
              p2 = flipped[1].dataset.pairId,
              name1 = flipped[0].dataset.name;
            if (p1 === p2) {
              flipped.forEach((c) => {
                c.classList.add("matched");
                matchedData.push({ pairId: p1, name: name1 });
              });
              matched++;
              flipped = [];
              lock = false;
              const m = MOMENTS_DATA.find((d) => d.t === name1);
              if (m) {
                mcName.textContent = m.t;
                mcDesc.innerHTML =
                  m.c + `<span class="tam-mc">${m.tam_c}</span>`;
                const imgSrc = DIR.MOMENTS + encodeURIComponent(m.t + ".jpg");
                mcImg.src = imgSrc;
                mcImg.onerror = () => {
                  mcImg.style.display = "none";
                };
                memoryModal.classList.add("open");
              }
              updateStatus();
              if (matched === 4) {
                matchCompleted = true;
                nextBtn.disabled = false;
                nextBtn.innerHTML =
                  'Next <span style="display:block;font-size:0.6em;font-weight:400;text-transform:none;">🎉 All memories collected!</span>';
                status.textContent = "✅ All memories collected!";
              }
            } else {
              setTimeout(() => {
                flipped.forEach((c) => c.classList.remove("flipped"));
                flipped = [];
                lock = false;
              }, 700);
            }
          }
          updateStatus();
        }

        function updateStatus() {
          if (!matchCompleted)
            status.textContent = `${matched} of 4 pairs matched`;
        }

        mcContinue.addEventListener("click", () =>
          memoryModal.classList.remove("open"),
        );
        memoryModal.addEventListener("click", (e) => {
          if (e.target === memoryModal) memoryModal.classList.remove("open");
        });
        renderCards();

        const matchKeyHandler = (event) => {
          if (event.repeat || app.idx !== LEN) return;
          if (event.key === "Enter" || event.key === "NumpadEnter") {
            if (matchCompleted) {
              event.preventDefault();
              nextBtn.click();
            }
            return;
          }
          if (event.key === " " || event.code === "Space") {
            if (matchCompleted || lock) return;
            const nextCard = cards.find(
              (card) =>
                !card.classList.contains("flipped") &&
                !card.classList.contains("matched"),
            );
            if (nextCard) {
              event.preventDefault();
              nextCard.click();
            }
          }
        };
        if (window.__matchKeyHandler)
          window.removeEventListener("keydown", window.__matchKeyHandler);
        window.__matchKeyHandler = matchKeyHandler;
        window.addEventListener("keydown", matchKeyHandler);
        nextBtn.addEventListener("click", () => {
          if (matchCompleted) go(LEN + 1);
        });
      }

      function initScrambleGame(el) {
        const lettersContainer = el.querySelector("#scrambleLetters");
        const wordDisplay = el.querySelector("#scrambleWordDisplay");
        const status = el.querySelector("#scrambleStatus");
        const progressFill = el.querySelector("#scrambleProgressFill");
        const nextBtn = el.querySelector("#scrambleNextBtn");
        const scrambleModal = document.getElementById("scrambleCollected");
        const scName = document.getElementById("scName");
        const scImg = document.getElementById("scImg");
        const scDesc = document.getElementById("scDesc");
        const scContinue = document.getElementById("scContinue");
        let currentWord = [],
          placed = 0,
          currentWordData = null,
          wordLetters = [],
          isWordComplete = false;
        const selected = pickUniqueMoments(5);
        scrambleWords = selected.map((m) => ({
          name: m.t.toUpperCase(),
          desc: m.c,
          tamDesc: m.tam_c,
          imgName: m.t,
          displayName: m.t,
        }));

        function loadWord(index) {
          if (index >= scrambleWords.length) {
            scrambleCompleted = true;
            isWordComplete = false;
            nextBtn.disabled = false;
            nextBtn.innerHTML =
              'Next <span style="display:block;font-size:0.6em;font-weight:400;text-transform:none;">🎉 All words unlocked!</span>';
            status.textContent = "✅ All words unlocked!";
            progressFill.style.width = "100%";
            wordDisplay.innerHTML = "🎉 Complete!";
            lettersContainer.innerHTML = "";
            return;
          }
          isWordComplete = false;
          currentWordData = scrambleWords[index];
          const word = currentWordData.name;
          wordLetters = word.split("");
          currentWord = [];
          placed = 0;
          wordDisplay.innerHTML = "";
          wordLetters.forEach((letter, idx) => {
            const slot = document.createElement("span");
            slot.className = "letter-slot empty";
            slot.textContent = "_";
            slot.dataset.index = idx;
            wordDisplay.appendChild(slot);
          });
          const shuffled = [...wordLetters].sort(() => Math.random() - 0.5);
          lettersContainer.innerHTML = "";
          shuffled.forEach((letter, idx) => {
            const div = document.createElement("div");
            div.className = "scramble-letter";
            div.textContent = letter;
            div.dataset.letter = letter;
            div.dataset.index = idx;
            div.addEventListener("click", () => placeLetter(div));
            lettersContainer.appendChild(div);
          });
          progressFill.style.width = `${(index / scrambleWords.length) * 100}%`;
          status.textContent = `Word ${index + 1} of ${scrambleWords.length}`;
        }

        function placeLetter(div) {
          if (
            div.classList.contains("placed") ||
            scrambleCompleted ||
            isWordComplete
          )
            return;
          const expected = wordLetters[placed];
          if (div.dataset.letter === expected) {
            div.classList.add("placed");
            currentWord.push(expected);
            const slots = wordDisplay.querySelectorAll(".letter-slot");
            if (slots[placed]) {
              slots[placed].textContent = expected;
              slots[placed].className = "letter-slot filled";
            }
            placed++;
            if (placed === wordLetters.length) {
              isWordComplete = true;
              const m = MOMENTS_DATA.find(
                (d) => d.t === currentWordData.displayName,
              );
              if (m) {
                scName.textContent = m.t;
                scDesc.innerHTML =
                  m.c + `<span class="tam-sc">${m.tam_c}</span>`;
                const imgSrc = DIR.MOMENTS + encodeURIComponent(m.t + ".jpg");
                scImg.src = imgSrc;
                scImg.onerror = () => {
                  scImg.style.display = "none";
                };
                scrambleModal.classList.add("open");
              }
            }
          } else {
            div.classList.add("wrong");
            setTimeout(() => div.classList.remove("wrong"), 400);
          }
        }

        scContinue.addEventListener("click", () => {
          scrambleModal.classList.remove("open");
          scrambleIndex++;
          loadWord(scrambleIndex);
        });
        scrambleModal.addEventListener("click", (e) => {
          if (e.target === scrambleModal) {
            scrambleModal.classList.remove("open");
            scrambleIndex++;
            loadWord(scrambleIndex);
          }
        });
        scrambleIndex = 0;
        loadWord(0);

        const scrambleKeyHandler = (event) => {
          if (
            event.repeat ||
            app.idx !== LEN + 1 ||
            scrambleCompleted ||
            !currentWordData
          )
            return;
          const key = event.key.toUpperCase();
          if (!/^[A-Z]$/.test(key)) return;
          event.preventDefault();
          const nextTile = Array.from(
            lettersContainer.querySelectorAll(".scramble-letter"),
          ).find(
            (tile) =>
              !tile.classList.contains("placed") && tile.dataset.letter === key,
          );
          if (nextTile) placeLetter(nextTile);
        };
        if (window.__scrambleKeyHandler)
          window.removeEventListener("keydown", window.__scrambleKeyHandler);
        window.__scrambleKeyHandler = scrambleKeyHandler;
        window.addEventListener("keydown", scrambleKeyHandler);

        const scramblePageKeyHandler = (event) => {
          if (event.repeat || app.idx !== LEN + 1) return;
          if (event.key === "Enter" || event.key === "NumpadEnter") {
            if (scrambleCompleted) {
              event.preventDefault();
              nextBtn.click();
            }
            return;
          }
          if (
            (event.key === " " || event.code === "Space") &&
            !scrambleCompleted &&
            !isWordComplete
          ) {
            event.preventDefault();
            const nextTile = Array.from(
              lettersContainer.querySelectorAll(
                ".scramble-letter:not(.placed)",
              ),
            )[0];
            if (nextTile) placeLetter(nextTile);
          }
        };
        if (window.__scramblePageKeyHandler)
          window.removeEventListener(
            "keydown",
            window.__scramblePageKeyHandler,
          );
        window.__scramblePageKeyHandler = scramblePageKeyHandler;
        window.addEventListener("keydown", scramblePageKeyHandler);
        nextBtn.addEventListener("click", () => {
          if (scrambleCompleted) go(LEN + 2);
        });
      }

        const manifestKeyHandler = (event) => {
          if (event.repeat || app.idx !== LEN + 2) return;
          if (event.key === "Enter" || event.key === "NumpadEnter") {
            if (manifestationCompleted) {
              event.preventDefault();
              nextBtn.click();
            }
            return;
          }
          if (event.key === " " || event.code === "Space") {
            if (selected.length >= 2) return;
            const nextCard = [...grid.children].find(
              (card) =>
                !card.disabled &&
                !card.classList.contains("locked") &&
                !selected.includes(Number(card.dataset.index)),
            );
            if (nextCard) {
              event.preventDefault();
              nextCard.click();
            }
          }
        };
        if (window.__manifestKeyHandler)
          window.removeEventListener("keydown", window.__manifestKeyHandler);
        window.__manifestKeyHandler = manifestKeyHandler;
        window.addEventListener("keydown", manifestKeyHandler);
        nextBtn.addEventListener("click", () => {
          if (manifestationCompleted) go(LEN + 3);
        });
        return el;
      }

      function openWall(pushHistory = true) {
        if (pushHistory && history.state?.view !== "wall") {
          wallReturnIndex = app.idx;
          history.pushState(
            { view: "wall", returnIndex: app.idx },
            "",
            "#photo-wall",
          );
        } else if (!pushHistory)
          wallReturnIndex = history.state?.returnIndex ?? app.idx;
        const cols = $("#wallCols");
        cols.innerHTML = "";
        MOMENTS_DATA.forEach((m, i) => {
          const rnd = randSeed(m.t);
          const card = document.createElement("div");
          card.className = "wcard";
          card.style.transform = `rotate(${((rnd() * 2 - 1) * 5).toFixed(1)}deg) translateY(${((rnd() * 2 - 1) * 10).toFixed(1)}px)`;
          card.title = m.t;
          const im = document.createElement("img");
          im.alt = m.t;
          im.draggable = false;
          im.onerror = () => {
            const dv = document.createElement("div");
            dv.className = "mi";
            dv.textContent = m.t;
            im.replaceWith(dv);
          };
          card.appendChild(im);
          card.addEventListener("click", () => {
            const source = im.getAttribute("src");
            if (source) openPhotoViewer(source);
          });
          cols.appendChild(card);
          resolveImage(m).then((src) => (im.src = src));
        });
        $("#wall").classList.add("open");
      }

      function closeWall() {
        $("#wall").classList.remove("open");
      }

      function openPhotoViewer(source, pushHistory = true) {
        $("#photoViewerImage").src = source;
        $("#photoViewer").classList.add("open");
        if (pushHistory && history.state?.view !== "viewer")
          history.pushState({ view: "viewer" }, "", "#photo-viewer");
      }

      function closePhotoViewer() {
        $("#photoViewer").classList.remove("open");
        $("#photoViewerImage").removeAttribute("src");
      }

      function closeWallAndRestoreHistory() {
        if (history.state?.view === "wall") history.back();
        else closeWall();
      }

      $("#photoViewer").addEventListener("click", (e) => {
        if (e.target === e.currentTarget) {
          if (history.state?.view === "viewer") history.back();
          else {
            closePhotoViewer();
            openWall(false);
          }
        }
      });
      $("#wall .bd").addEventListener("click", closeWallAndRestoreHistory);
      $("#wallClose").addEventListener("click", closeWallAndRestoreHistory);

      addEventListener("popstate", (event) => {
        if (event.state?.view === "viewer")
          openPhotoViewer($("#photoViewerImage").src, false);
        else if (event.state?.view === "wall") {
          closePhotoViewer();
          openWall(false);
        } else {
          closePhotoViewer();
          closeWall();
          if (wallReturnIndex !== null && app.idx !== wallReturnIndex) {
            const returnIndex = wallReturnIndex;
            wallReturnIndex = null;
            go(returnIndex);
          }
        }
      });

      addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if ($("#photoViewer").classList.contains("open")) {
          if (history.state?.view === "viewer") history.back();
          else {
            closePhotoViewer();
            openWall(false);
          }
        } else if ($("#memoryCollected").classList.contains("open"))
          $("#memoryCollected").classList.remove("open");
        else if ($("#scrambleCollected").classList.contains("open"))
          $("#scrambleCollected").classList.remove("open");
        else if ($("#langModal").classList.contains("open"))
          $("#langModal").classList.remove("open");
        else closeWallAndRestoreHistory();
      });

      function randSeed(s) {
        let a = 0;
        for (const c of s) a = (a * 31 + c.charCodeAt(0)) >>> 0;
        return () => (a = (a * 1664525 + 1013904223) >>> 0) / 4294967296;
      }

      if (
        matchMedia("(hover:hover)").matches &&
        !matchMedia("(prefers-reduced-motion: reduce)").matches
      ) {
        stage.addEventListener("pointermove", (e) => {
          const fr = e.target.closest?.(".frame");
          if (!fr) return;
          const r = fr.getBoundingClientRect();
          const dx = (e.clientX - r.left) / r.width - 0.5,
            dy = (e.clientY - r.top) / r.height - 0.5;
          fr.style.transform = `perspective(900px) rotateY(${dx * 5}deg) rotateX(${-dy * 5}deg)`;
        });
        stage.addEventListener("pointerout", (e) => {
          const fr = e.target.closest?.(".frame");
          if (fr) fr.style.transform = "";
        });
      }

      document.body.classList.add("day");
      go(-1);
    </script>
